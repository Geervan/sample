
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLCM Mobile | For MUJ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #000; color: #fff; }
        .btn-orange { background: #CD5C28; transition: all 0.2s; }
        .btn-orange:hover { background: #BA3300; transform: translateY(-2px); shadow: 0 10px 30px -10px rgba(205, 92, 40, 0.5); }
        .logo-glow { shadow: 0 0 20px rgba(205, 92, 40, 0.1); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="h-screen w-full flex flex-col items-center justify-center overflow-hidden p-6 border-t-[3px] border-[#CD5C28]">
    
    <div class="w-full max-w-sm flex flex-col items-center text-center">
        
        <!-- Logo Image -->
        <div class="mb-10">
            <img src="logo.jpg" alt="SLCM Mobile Logo" class="w-20 h-20 rounded-[1.8rem] logo-glow shadow-2xl transition-transform hover:scale-110 duration-500">
        </div>

        <!-- Branding -->
        <div class="mb-10">
            <h1 class="text-4xl font-black tracking-tighter mb-4 uppercase">
                MUJSLCM <span class="text-[#CD5C28]">Mobile</span>
            </h1>
            <div class="space-y-1">
                <p class="text-lg font-bold text-zinc-300">The MUJSLCM portal, but actually fast.</p>
                <p class="text-[10px] font-black tracking-[0.2em] text-[#CD5C28] uppercase">Manipal University Jaipur</p>
            </div>
        </div>

        <!-- Download Action -->
        <div class="w-full space-y-5">
            <a href="app-release.apk" class="btn-orange block w-full py-5 rounded-xl font-black text-lg transition-all active:scale-95 shadow-xl shadow-orange-950/20">
                Download APK
            </a>
            
            <div class="flex justify-between px-2 text-[10px] font-black text-zinc-700 tracking-widest uppercase">
                <span>v1.0.2</span>
                <span>•</span>
                <span>Android only</span>
                <span>•</span>
                <span>56 MB</span>
            </div>
        </div>

        <!-- Footer with LinkedIn -->
        <footer class="mt-14 space-y-1">
            <p class="text-[10px] font-black text-zinc-700 tracking-[0.15em] uppercase">Built for MUJ students</p>
            <p class="text-xs font-bold text-zinc-400">
                by <a href="https://www.linkedin.com/in/geervan" target="_blank" class="text-[#CD5C28] hover:underline decoration-2 transition-all">Geervan</a>
            </p>
        </footer>

    </div>

</body>
</html>
